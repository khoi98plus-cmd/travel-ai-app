version: '3.8'

services:
  # Backend FastAPI
  backend:
    build: ./backend
    container_name: travel_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    restart: always

  # Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: travel_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: travel_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache (Trái tim của hệ thống tối ưu chi phí)
  redis:
    image: redis:7-alpine
    container_name: travel_cache
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
